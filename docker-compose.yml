services:
  mysql:
    image: mysql:8.0
    container_name: mock-server-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mockpass
      MYSQL_DATABASE: mock_server
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pmockpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4.8.1
    container_name: mock-server-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  mysql_data: